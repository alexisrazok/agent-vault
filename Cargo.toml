[package]
name = "agent-vault"
version = "0.1.0"
edition = "2021"
description = "Cross-platform zero-knowledge secret proxy and output redactor for AI coding agents and MCP servers."
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai", "agents", "mcp", "security", "secrets"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
rand = "0.8"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = "2.12"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.13"
